name: CI/CD Pipeline
on: [workflow_dispatch]

jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Run Tests
        run: echo "Running Automated Tests ..."

      # This step only runs if the branch is exactly 'refs/heads/main'
      - name: Deploy to Production
        if: github.ref == 'refs/heads/main'
        run: echo "Deploying The Artifact. To Production ..."
