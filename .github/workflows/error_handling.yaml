name: Error Handling Project
on: workflow_dispatch

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Run test suite
        run: exit 1 # If this fails, the next step is skipped

      - name: Notify Slack on Failure
        if: failure()  # Acts as the "catch" block
        run: echo "Sending failure alert to Slack..."

      - name: Upload Test Logs
        if: always()   # Acts as the "finally" block
        run: echo "Uploading logs regardless of success or failure"

  build:
    runs-on: ubuntu-latest
    steps:
      - name: Run Flaky Linter
        id: linter
        run: exit 1 # Simulating a failure
        continue-on-error: true

      - name: Check Linter Outcome
        # We must check 'outcome' instead of using 'failure()' because 
        # continue-on-error prevented the job itself from entering a failed state.
        if: steps.linter.outcome == 'failure'
        run: echo "The linter failed, but the build is still going!"

      - name: Critical Build Step
        run: echo "This step runs normally because the previous error was ignored."
